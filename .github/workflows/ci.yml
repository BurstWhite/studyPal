name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun test

  build:
    name: Build the macOS app
    # The app bundles a Swift helper that links EventKit, so it builds on macOS only.
    runs-on: macos-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs `build:sidecar` first (the Bun server and the Swift helper), then
      # compiles the Tauri shell and assembles studyPal.app.
      - name: Build the app
        run: bun run app:build

      - name: Check the bundle is complete
        run: |
          app="src-tauri/target/release/bundle/macos/studyPal.app"
          for binary in studypal studypal-server studypal-eventkit; do
            test -x "$app/Contents/MacOS/$binary" || { echo "missing $binary"; exit 1; }
          done
          /usr/libexec/PlistBuddy -c "Print :NSCalendarsFullAccessUsageDescription" "$app/Contents/Info.plist"

      # Zipped with ditto so the bundle keeps its executable bits and symlinks.
      - name: Package the app
        run: |
          ditto -c -k --keepParent \
            src-tauri/target/release/bundle/macos/studyPal.app \
            studyPal-macos-arm64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: studyPal-macos-arm64
          path: studyPal-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
